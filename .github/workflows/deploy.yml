name: Deploy to GitHub Pages

on:
  push:
    # Only main: the github-pages environment restricts deployments to that
    # branch, so runs from any other branch build fine but cannot deploy.
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "prototype/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Requires Pages to be enabled with "GitHub Actions" as the source.
      # `enablement` only succeeds when the workflow token may create the site;
      # otherwise enable it once under Settings > Pages (see README).
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
